[package]
name = "cipherbox-pqc-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
getrandom = "0.2"

[dependencies.cipherbox-pqc-core]
path = ".."

[[bin]]
name = "decrypt_file"
path = "fuzz_targets/decrypt_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kem_decaps"
path = "fuzz_targets/kem_decaps.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
