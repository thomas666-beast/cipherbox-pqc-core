[package]
name = "cipherbox-pqc-core"
version = "0.7.0"
edition = "2024"
authors = ["Thomas <selfworker112@mailfence.com>"]
description = "From-scratch post-quantum cryptography core: ML-KEM-768/1024, X25519 hybrid KEM, secret-derived rooms with ratchet, Keccak, chunked file encryption (unaudited)"
license = "MIT"
repository = "https://github.com/thomas666-beast/cipherbox-pqc-core"
keywords = ["pqc", "cryptography", "post-quantum", "kyber", "ml-kem"]
categories = ["cryptography"]

[dependencies]
getrandom = "0.2"
ml-dsa = "=0.1.2"
chacha20poly1305 = "0.10"
argon2 = "0.5"
base64 = "0.22"
zeroize = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
hex-literal = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
